<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/signup.css">
    <title>회원가입 페이지</title>
</head>
<body>
    <div class="bubble-bg" style="width:500px;height:500px;background:rgba(255,183,197,0.4);top:50%;left:45%;transform:translate(-50%,-50%);animation-duration:8s;"></div>
    <div class="bubble-bg" style="width:450px;height:450px;background:rgba(169,204,227,0.25);top:55%;left:58%;transform:translate(-50%,-50%);animation-duration:10s;"></div>
    <div class="bubble-bg" style="width:280px;height:280px;background:rgba(255,183,197,0.35);top:60px;left:100px;animation-duration:12s;"></div>
    
    <div class="signup-page">
    <div class="signup-wrapper">
        <button class="back-btn" onclick="window.history.back()">← 뒤로</button>
        <h1 class="signup-title">회원가입</h1>

        <form id="signupForm">
             <div class="input-group">
                <label class="label-text">이름</label>   
                <input type="text" id="name" name="name">
            </div>

            <div class="input-group">
                <label class="label-text">이메일</label>   
                <input type="email" id="email" name="email">
                <button type="button" class="checkBtn" id="emailBtn" name="emailBtn">이메일 중복확인</button>
            </div>

            <div class="input-group">
                <label class="label-text">아이디</label>   
                <input type="text" id="userId" name="userId">
                <button type="button" class="checkBtn" id="userIdBtn" name="userIdBtn">아이디 중복확인</button>
            </div>

            <div class="input-group">
                <label class="label-text">비밀번호</label>  
                <input type="password" id="password" name="password">
            </div>
            <button type="submit" class="signupBtn" id="signupBtn">회원가입</button></form>
            <div class="social-signup">
            <a href="/api/auth/google" class="google-btn">
                <span class="google-icon">G</span>
                <span>Google로 시작하기</span>
            </a>
            <a href="/api/auth/kakao" class="kakao-btn">
              <span class="social-icon kakao-icon">K</span>
              <span>카카오로 시작하기</span>
            </a>
    </div>
    
    <div id="signup-toast" class="signup-toast hidden"></div>
    </div>
    <script src="/js/signup.js"></script>
</body>
</html>
