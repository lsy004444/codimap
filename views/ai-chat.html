<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 코디 추천</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #000;
    }
    .chat-header h2 {
      font-size: 16px;
      font-weight: 600;
    }
    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #000000;
      color: #ffffff;
    }
    .msg.ai {
      align-self: flex-start;
      background: #f2f2f2;
      color: #000000;
    }
    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid #e5e5e5;
    }
    #chatInput {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }
    #chatInput:focus {
      border-color: #000;
    }
    #sendBtn {
      padding: 10px 18px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    #sendBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-header">
    <button onclick="location.href='/map'"><i class="ti ti-arrow-left"></i></button>
    <h2>AI 코디 추천</h2>
  </div>

  <div id="chatMessages"></div>

  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="예: 오늘 소개팅룩 추천해줘" onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">전송</button>
  </div>

  <script src="/js/ai-chat.js"></script>
</body>
</html>
