<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
    <title>로그인 페이지</title>
</head>
<body>
   <div class="bubble-bg" style="width:500px;height:500px;background:rgba(255,183,197,0.4);top:50%;left:45%;transform:translate(-50%,-50%);animation-duration:8s;"></div>
    <div class="bubble-bg" style="width:450px;height:450px;background:rgba(169,204,227,0.25);top:55%;left:58%;transform:translate(-50%,-50%);animation-duration:10s;"></div>
    <div class="bubble-bg" style="width:380px;height:180px;background:rgba(255,183,197,0.35);top:60px;left:120px;animation-duration:12s;"></div>
    
    <div class="login-page">
    <div class="login-wrapper">
        <button class ="back-btn" onclick="window.history.back()">← 뒤로</button>
        <h1 class="login-title">CODIMAP</h1>
    <form id="login-form">
        <div class="input-group">
           <label class="label-text">이메일</label>   
           <input type="email" id="email" name="email">
        </div>
        <div class="input-group">
            <label class="label-text">비밀번호</label>  
            <input type="password" id="password" name="password">
        </div>
        <button type="submit" id="login" name="login">로그인</button>
        <div class="social-login">
            <a href="/api/auth/google" class="google-btn">
                <span class="google-icon">G</span>
                <span>Google로 로그인</span>
            </a>
            <a href="/api/auth/kakao" class="kakao-btn">
              <span class="social-icon kakao-icon">K</span>
              <span>카카오로 로그인</span>
            </a>

            <a href="/api/auth/apple" class="apple-btn">
              <span class="social-icon apple-icon">●</span>
             <span>Apple로 로그인</span>
            </a>
        </div>
        
        <div class="auto-login">
            <input type="checkbox" id="autoLogin">
            <label for="autoLogin">자동 로그인</label>
        </div>
        <div class="find_pw">
            <a href="find_pw">비밀번호 찾기</a>
            <span class="divider">|</span>
            <a href="/signup">회원가입</a>
        </div>
    </form>
    </div>
        <div id="login-toast" class="login-toast hidden"></div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
