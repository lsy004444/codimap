<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 등록</title>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
    <link rel="stylesheet" href="/css/outfit.css">
</head>
<body>
    <div class="modal">
 

  <div class="modal-header">
    <h1>게시물 등록</h1>
    <div class="btn-group">
      <button class="btn-cancel"   onclick="handleCancel()">취소</button>
      <button class="btn-register" onclick="handleRegister()">등록</button>
    </div>
  </div>
 
  
  <div class="modal-body">
 

    <div>
      <p class="section-label">사진 업로드</p>
 
      <div class="upload-area" id="uploadArea">
      
        <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)" />
        <div class="upload-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <span class="upload-text">클릭하여 사진 추가</span>
        <span class="upload-sub">여러 장 선택 가능</span>
      </div>
 
   
      <div class="preview-list" id="previewList"></div>
 

      <div class="meta-box" id="metaBox" style="display:none;">
        <p class="meta-box-label">사진 메타데이터 (첫 번째 사진 기준)</p>
        <div class="meta-tags" id="metaTags"></div>
      </div>
 
     
      <div id="metaMissing" style="display:none;">
        <div class="meta-missing">
          <span>⚠️</span>
          <span>위치 정보를 가져올 수 없어요. 직접 선택해주세요.</span>
        </div>
        <button class="btn-location-pick" onclick="openSubtab()">📍 지역 직접 선택</button>
      </div>
 
    
      <div class="selected-location" id="selectedLocationArea" style="display:none;">
        <span>📍</span>
        <span id="selectedLocationText"></span>
        <button class="btn-change" onclick="openSubtab()">변경</button>
      </div>
    </div>
 
    <div class="divider"></div>
 
   
    <div>
      <p class="section-label">게시물 설명</p>
      <textarea id="descInput" placeholder="사진에 대한 설명을 입력해주세요..."></textarea>
    </div>
 
    <div class="divider"></div>
 

    <div>
      <div class="link-header">
        <p class="section-label" style="margin:0;">쇼핑몰 링크</p>
        <button class="btn-add-link" onclick="addLinkRow()">+ 링크 추가</button>
      </div>
      <div class="link-list" id="linkList">
  
      </div>
    </div>
 
    <div style="height:8px;"></div>
  </div>
</div>

<div class="subtab-overlay" id="subtabOverlay">
  <div class="subtab-card">
    <button class="btn-subtab-close" onclick="closeSubtab()">✕</button>
    <p class="subtab-title">📍 지역 선택</p>
    <p class="subtab-desc">주소를 검색하여 선택해주세요. 시 · 구 · 동까지 자동으로 추출됩니다.</p>
    <button class="btn-open-kakao" onclick="openKakaoPostcode()">주소 검색하기</button>
    <div class="season-select" id="seasonSelect" style="display:none;">
  <p class="season-label">계절 선택</p>
  <div class="season-buttons">
    <button class="btn-season" onclick="selectSeason('봄')">봄</button>
    <button class="btn-season" onclick="selectSeason('여름')">여름</button>
    <button class="btn-season" onclick="selectSeason('가을')">가을</button>
    <button class="btn-season" onclick="selectSeason('겨울')">겨울</button>
  </div>
</div>

    <div class="addr-result" id="addrResult">
      선택된 위치: <strong id="addrPreview"></strong>
    </div>
    <button class="btn-confirm-addr" id="btnConfirmAddr"
            style="display:none;" onclick="confirmLocation()">
      이 위치로 설정
    </button>
  </div>
</div>
 
<script>

  let uploadedFiles   = [];   
  let pendingLocation = null; 
 

  window.addEventListener('DOMContentLoaded', () => {
    for (let i = 1; i <= 4; i++) addLinkRow();
  });
 

  function handleFiles(files) {
    if (!files || files.length === 0) return;
 
    
    Array.from(files).forEach(file => uploadedFiles.push(file));
 
    renderPreviews();
 
   
    parseMetadata(uploadedFiles[0]);
  }
 

  function renderPreviews() {
    const list = document.getElementById('previewList');
    list.innerHTML = '';
 
    uploadedFiles.forEach((file, idx) => {
      const url  = URL.createObjectURL(file);
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML = `
        <img src="${url}" alt="preview-${idx}" />
        ${idx === 0 ? '<div class="badge-rep">대표</div>' : ''}
        <button class="btn-del" onclick="removeFile(${idx})">✕</button>
      `;
      list.appendChild(item);
    });
  }
 

  function removeFile(idx) {
    uploadedFiles.splice(idx, 1);
    renderPreviews();
 
    if (uploadedFiles.length === 0) {
    
      hideAllMeta();
    } else {
      
      parseMetadata(uploadedFiles[0]);
    }
  }
 

  function hideAllMeta() {
    document.getElementById('metaBox').style.display          = 'none';
    document.getElementById('metaMissing').style.display      = 'none';
    document.getElementById('selectedLocationArea').style.display = 'none';
  }
 

  function parseMetadata(file) {
  
    EXIF.getData(file, function() {
      const dateStr = EXIF.getTag(this, 'DateTimeOriginal');
      const lat     = EXIF.getTag(this, 'GPSLatitude');
      const latRef  = EXIF.getTag(this, 'GPSLatitudeRef');
      const lon     = EXIF.getTag(this, 'GPSLongitude');
      const lonRef  = EXIF.getTag(this, 'GPSLongitudeRef');
 
      const hasDate = !!dateStr;
      const hasGPS  = lat && lon;
 
  
      let formattedDate = '날짜 정보 없음';
      let season        = '';
      if (hasDate) {
        // "2024:11:03 14:32:00" → "2024.11.03 · 14:32"
        const [datePart, timePart] = dateStr.split(' ');
        const [y, m, d] = datePart.split(':');
        const [hh, mm]  = timePart.split(':');
        formattedDate   = `${y}.${m}.${d} · ${hh}:${mm}`;
        season          = getSeason(parseInt(m, 10));
      }
 
  
      let locationStr = null;
      if (hasGPS) {
        const latitude  = dmsToDecimal(lat,  latRef);
        const longitude = dmsToDecimal(lon,  lonRef);
 
        locationStr = `${latitude.toFixed(4)}°N, ${longitude.toFixed(4)}°E`;
      }
 

      if (hasDate || hasGPS) {
        showMetaTags(formattedDate, locationStr, season);
        document.getElementById('metaMissing').style.display = 'none';
      } else {
      
        document.getElementById('metaBox').style.display     = 'none';
        document.getElementById('metaMissing').style.display = 'block';
      }
    });
  }
 

  function showMetaTags(dateStr, locationStr, season) {
    const box  = document.getElementById('metaBox');
    const tags = document.getElementById('metaTags');
    box.style.display = 'block';
 
    tags.innerHTML = `
      <div class="meta-tag">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="#6B7280" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>${dateStr}</span>
      </div>
      ${locationStr ? `
      <div class="meta-tag">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="#6B7280" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>${locationStr}</span>
      </div>` : ''}
      ${season ? `
      <div class="meta-tag">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="#6B7280" stroke-width="2">
          <path d="M12 2a10 10 0 0 1 0 20A10 10 0 0 1 12 2"/>
          <path d="M12 6v6l3 3"/>
        </svg>
        <span>${season}</span>
      </div>` : ''}
    `;
 
    document.getElementById('metaMissing').style.display = 'none';
  }
 
 
  function dmsToDecimal(dms, ref) {
    const d = dms[0] + dms[1] / 60 + dms[2] / 3600;
    return (ref === 'S' || ref === 'W') ? -d : d;
  }
 

  function getSeason(month) {
    if ([3,4,5].includes(month))  return '봄';
    if ([6,7,8].includes(month))  return '여름';
    if ([9,10,11].includes(month))return '가을';
    return '겨울';
  }
 

  function openSubtab()  {
    document.getElementById('subtabOverlay').classList.add('show');
  }
  function closeSubtab() {
    document.getElementById('subtabOverlay').classList.remove('show');
    pendingLocation = null;
    document.getElementById('addrResult').classList.remove('show');
    document.getElementById('btnConfirmAddr').style.display = 'none';
    document.getElementById('seasonSelect').style.display = 'none';
  }
 

  function openKakaoPostcode() {
    new daum.Postcode({
      oncomplete: function(data) {
      
        const sido    = data.sido;    
        const sigungu = data.sigungu; 
        const bname   = data.bname;   
        const full    = `${sido} ${sigungu} ${bname}`;
 

        pendingLocation = { sido, sigungu, bname, full };
 
  
        document.getElementById('addrPreview').textContent = full;
        document.getElementById('addrResult').classList.add('show');
        document.getElementById('btnConfirmAddr').style.display = 'block';
        document.getElementById('seasonSelect').style.display = 'block';
      }
    }).open();
  }

  let selectedSeason = null;  // 상단 변수 선언부에 추가

function selectSeason(season) {
  selectedSeason = season;
  document.querySelectorAll('.btn-season').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(season));
  });
}
 

  function confirmLocation() {
  if (!pendingLocation) return;
  if (!selectedSeason) {
    alert('계절을 선택해주세요.');
    return;
  }

  document.getElementById('selectedLocationText').textContent = pendingLocation.full;
  document.getElementById('selectedLocationArea').style.display = 'flex';
  document.getElementById('metaMissing').style.display = 'none';

  showMetaTags('날짜 정보 없음', pendingLocation.full, selectedSeason);

  closeSubtab();
  selectedSeason = null;
}
 
 
  let linkCount = 0;
 
  function addLinkRow() {
    linkCount++;
    const list = document.getElementById('linkList');
    const row  = document.createElement('div');
    row.className   = 'link-row';
    row.id          = `linkRow-${linkCount}`;
    row.innerHTML   = `
      <div class="link-icon">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="#9CA3AF" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <input class="link-input" type="url"
             placeholder="https://shop.example.com/product"
             id="link-${linkCount}" />
      <button class="btn-del-link" onclick="removeLinkRow('linkRow-${linkCount}')">✕</button>
    `;
    list.appendChild(row);
  }
 
  function removeLinkRow(rowId) {
    const row = document.getElementById(rowId);
    if (row) row.remove();
  }
 

  function handleCancel() {
    if (confirm('작성 중인 내용이 사라집니다. 취소하시겠어요?')) {

      location.reload();
    }
  }
 
  function handleRegister() {

    if (uploadedFiles.length === 0) {
      alert('사진을 한 장 이상 업로드해주세요.');
      return;
    }
    const desc = document.getElementById('descInput').value.trim();
    if (!desc) {
      alert('게시물 설명을 입력해주세요.');
      return;
    }

    const links = Array.from(document.querySelectorAll('.link-input'))
      .map(el => el.value.trim())
      .filter(v => v !== '');
 
    const payload = {
      files       : uploadedFiles.map(f => f.name),
      description : desc,
      links,
      location    : pendingLocation   
    };
    console.log('등록 데이터:', payload);
    alert('등록되었습니다!');
  }
</script>
</body>
</html>
