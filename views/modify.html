<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/modify.css">
    <title>개인정보 수정 페이지</title>
</head>
<body>
    <div class="modify-page">
    <div class="modify-wrapper">
        <button type="button" class="btn-back" onclick="window.history.back()">뒤로</button>
        <h1 class="modify-title">아이디 / 비밀번호 변경</h1>
    <form>
        <div class="input-group">
           <label class="label-text">변경할 아이디</label>   
           <input type="text" id="userId" name="userId">
        </div>
        <div class="input-group">
            <label class="label-text">변경할 비밀번호</label>  
            <input type="password" id="password" name="password">
        </div>
        <button type="button" id="modifyBtn" name="modifyBtn" onclick="completeModify()">변경하기</button>
    </form>
    </div>
    <div id="modify-toast" class="modify-toast hidden"></div>
    </div>
    <script src="/js/modify.js"></script>
</body>
</html>
