<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/admin.css">
    <title>CODIMAP 관리자</title>
</head>
<body>
    <div class="admin-wrap">
        <header class="admin-header">
            <h1>🛡 CODIMAP 관리자</h1>
            <button class="admin-home-btn" onclick="location.href='/'">홈으로</button>
        </header>

        <!-- 신고 관리 -->
        <section id="tab-reports" class="admin-tab-content active">
            <div class="admin-filter">
                <button class="filter-btn active" data-status="">전체</button>
                <button class="filter-btn" data-status="pending">접수됨</button>
                <button class="filter-btn" data-status="resolved">처리완료</button>
                <button class="filter-btn" data-status="rejected">반려</button>
            </div>
            <div id="reportList" class="report-list">
                <p class="admin-empty">불러오는 중...</p>
            </div>
        </section>
    </div>

    <div id="toast" class="admin-toast hidden"></div>

    <script src="/js/admin.js"></script>
</body>
</html>
