<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="/css/outfit.css">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
    <meta charset="UTF-8">
    <meta name="referrer" content="origin">
    <link rel="stylesheet" href="/css/map.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <title>카카오 지도</title>
</head>
<body style="margin:0; padding:0;">

    <div class="main-container">
        <div id="map-container" class="full-screen" style="height: 100vh;">
           
            <div id="map" style="width:100%; height:100%;"></div>
            
            
            <div class="top-nav">
                <div class="logo">CODIMAP</div>
                <div class="search-box">
                    <input type="text" placeholder="지역을 검색하시오">
                    <button id="search-btn" onclick="window.searchLocation(document.querySelector('.search-box input').value)">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
                        stroke="#bbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                </div>

                <div id="season-filter-container" class="season-container"></div>
            </div>

            <!-- 햄버거 버튼 바 -->
            <div class = "hamburger-bar">
              <button class = "hamburger-btn" id="hamburger-btn" onclick="toggleSidebar()">
                <span></span>
                <span></span>
                <span></span>
              </button>
            </div>
            
            <!-- 페이지 이동 버튼 추가 -->
            <div class = "sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
            <div class = "sidebar-menu" id="sidebar-menu" onclick="handleMenuClick(event)">
              <div class="bubble-container">
                <div class="bubble bubble-large" onclick="openModal()">
                  <i class="ti ti-camera" aria-hidden="true"></i>
                  <span>게시물 등록</span>
                </div>
                <div class="bubble bubble-medium" id="mypageBtn">
                  <i class="ti ti-user" aria-hidden="true"></i>
                  <span>마이페이지</span>
                </div>
              </div>
              <div class="bubble-logout" id="logoutBtn">
                <i class="ti ti-logout" aria-hidden="true"></i>
                <span>로그아웃</span>
              </div>
            </div>

            <div id="current-filter-info" class="filter-status">
                현재 <span id="display-region">전국</span>의 
                <span id="display-season">봄</span> 코디를 보고 있습니다.
            </div>
        </div>

        <div id="side-panel" class="hidden">
            <iframe id="feed-frame" src="/feed" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <div id="map-toast" class="map-toast hidden"></div>
    </div>
        <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=84d8aeff75217261fb3eb2190840c88e&libraries=services&autoload=false"></script>
        <script src="/js/map.js"></script>
        <div class="upload-modal-overlay" id="uploadModalOverlay">
  <div class="modal">

    <div class="modal-header">
      <h1>게시물 등록</h1>
      <div class="btn-group">
        <button class="btn-cancel" onclick="handleCancel()">취소</button>
        <button class="btn-register" onclick="handleRegister()">등록</button>
      </div>
    </div>

    <div class="modal-body">

      <div>
        <p class="section-label">사진 업로드</p>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)" />
          <div class="upload-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <span class="upload-text">클릭하여 사진 추가</span>
          <span class="upload-sub">여러 장 선택 가능</span>
        </div>

        <div class="preview-list" id="previewList"></div>

        <div class="meta-box" id="metaBox" style="display:none;">
          <p class="meta-box-label">사진 정보 (첫 번째 사진 기준)</p>
          <div class="meta-tags" id="metaTags"></div>
        </div>

        <div id="metaMissing" style="display:none;">
          <div class="meta-missing">
            <span>⚠️</span>
            <span>위치/계절 정보를 가져올 수 없어요. 직접 선택해주세요.</span>
          </div>
          <button class="btn-location-pick" onclick="openSubtab()">📍 지역/계절 직접 선택</button>
        </div>

        <div class="selected-location" id="selectedLocationArea" style="display:none;">
          <span>📍</span>
          <span id="selectedLocationText"></span>
          <button class="btn-change" onclick="openSubtab()">변경</button>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <p class="section-label">게시물 설명</p>
        <textarea id="descInput" placeholder="사진에 대한 설명을 입력해주세요..."></textarea>
      </div>

      <div class="divider"></div>

      <div>
        <div class="link-header">
          <p class="section-label" style="margin:0;">쇼핑몰 링크</p>
          <button class="btn-add-link" onclick="addLinkRow()">+ 링크 추가</button>
        </div>
        <div class="link-list" id="linkList"></div>
      </div>

      <div style="height:8px;"></div>
    </div>
  </div>
</div>


<div class="subtab-overlay" id="subtabOverlay">
  <div class="subtab-card">
    <button class="btn-subtab-close" onclick="closeSubtab()">✕</button>
    <p class="subtab-title">📍 지역 선택</p>
    <p class="subtab-desc">주소를 검색하여 선택해주세요. 시 · 구 · 동까지 자동으로 추출됩니다.</p>
    <button class="btn-open-kakao" onclick="openKakaoPostcode()">주소 검색하기</button>

    <div class="season-select" id="seasonSelect" style="display:none;">
      <p class="season-label">계절 선택</p>
      <div class="season-buttons">
        <button class="btn-season" onclick="selectSeason('봄')">봄</button>
        <button class="btn-season" onclick="selectSeason('여름')">여름</button>
        <button class="btn-season" onclick="selectSeason('가을')">가을</button>
        <button class="btn-season" onclick="selectSeason('겨울')">겨울</button>
      </div>
    </div>

    <div class="addr-result" id="addrResult">
      선택된 위치: <strong id="addrPreview"></strong>
    </div>
    <button class="btn-confirm-addr" id="btnConfirmAddr"
            style="display:none;" onclick="confirmLocation()">
      이 위치로 설정
    </button>
  </div>
</div>

<script src="/js/outfit.js"></script>
</body>
</html>
