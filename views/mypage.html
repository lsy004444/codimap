<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/mypage.css">
    <title>마이페이지</title>
</head>
<body>
    <div class="mypage-wrapper">
        <div style="position:relative; width:100%; margin-bottom:40px; text-align:center;">
            <button onclick="window.history.back()" class="btn-back" style="position:absolute; left:0; top:50%; transform:translateY(-50%); margin:0;">
                뒤로
            </button>
            <h1 id="profileTitle" class="mypage-title" style="margin:0; display:inline-block;">@아이디</h1>
        </div>

        <form>
            <div class="input-group">
                <label class="label-text">아이디</label>   
                <input type="text" id="id" name="id" readonly class="readonly-input">
                <button type="button" id="modify" name="modify">프로필 수정</button>
            </div>

            <div class="tab">
                <button type="button" class="tab-item active" onclick="openTab(event, 'scrap')">스크랩</button>
                <button type="button" class="tab-item" onclick="openTab(event, 'following')">팔로잉/팔로워 목록</button>
                <button type="button" class="tab-item" onclick="openTab(event, 'posts')">게시물 목록</button>
                <button type="button" class="tab-item" onclick="openTab(event, 'comments')">댓글 목록</button>
            </div>
        </form>

        <div id="scrap" class="tab-content grid-container active">
            <div id="scrapList" class="gridList"></div>
        </div>

        <div id="following" class="tab-content follow-container">
            <div id="followList"></div>
        </div>

        <div id="posts" class="tab-content grid-container">
            <div id="postList" class="gridList"></div>
        </div>

        <div id="comments" class="tab-content comment-container">
            <div id="commentList"></div>
        </div>
    </div>

    <script src="/js/mypage.js?v=6"></script>
</body>
</html>
