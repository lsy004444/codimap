<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/mypage.css">
    <link rel="stylesheet" href="/css/outfit.css">
    <title>마이페이지</title>
</head>
<body>
  <div id="postFrameOverlay" style="display:none; position:fixed; inset:0; z-index:9999;">
    <iframe id="postFrame" style="position:absolute; inset:0; width:100%; height:100%; border:0;"></iframe>
  </div>
    <div style="position:absolute; width:400px; height:400px; background:rgba(169,204,227,0.3); border-radius:50%; top:-100px; right:-100px; filter:blur(40px); pointer-events:none; animation:float 9s ease-in-out infinite;"></div>
    <div style="position:absolute; width:300px; height:300px; background:rgba(255,183,197,0.25); border-radius:50%; bottom:-80px; left:-80px; filter:blur(35px); pointer-events:none; animation:float 11s ease-in-out infinite;"></div>
    <div style="position:absolute; width:200px; height:200px; background:rgba(169,204,227,0.2); border-radius:50%; top:40%; right:10%; filter:blur(30px); pointer-events:none; animation:float 7s ease-in-out infinite;"></div>
    <div class="mypage-wrapper">
        <div style="position:relative; width:100%; margin-bottom:40px; text-align:center;">
            <button onclick="window.history.back()" class="btn-back" style="position:absolute; left:0; top:50%; transform:translateY(-50%); margin:0;">
                뒤로
            </button>
            <button onclick="window.location.href='/'" style="position:absolute; right:0; top:50%; transform:translateY(-50%); margin:0; background:rgba(255,255,255,0.8); border:1.5px solid rgba(200,180,210,0.35); border-radius:50px; padding:10px 20px; font-size:0.8rem; font-weight:700; color:#c9a0b8; cursor:pointer; box-shadow:0 4px 16px rgba(200,160,184,0.15); letter-spacing:1px; backdrop-filter:blur(8px); transition:all 0.2s; font-family:'Outfit', sans-serif;">
                👗 CODIMAP
            </button>
            <h1 id="profileTitle" class="mypage-title" style="margin:0; display:inline-block;">@아이디</h1>
        </div>

        <form>
            <div class="input-group">
                <label class="label-text">아이디</label>   
                <input type="text" id="id" name="id" readonly class="readonly-input">
                <button type="button" id="modify" name="modify">프로필 수정</button>
            </div>

            <div class="tab">
                <button type="button" class="tab-item" onclick="openTab(event, 'scrap')">스크랩</button>
                <button type="button" class="tab-item" onclick="openTab(event, 'following')">팔로잉/팔로워 목록</button>
                <button type="button" class="tab-item active" onclick="openTab(event, 'posts')">게시물 목록</button>
                <button type="button" class="tab-item" onclick="openTab(event, 'comments')">댓글 목록</button>
            </div>
        </form>

        <div id="scrap" class="tab-content">
            <div id="scrapList" class="gridList"></div>
        </div>

        <div id="following" class="tab-content follow-container">
            <div id="followList"></div>
        </div>

        <div id="posts" class="tab-content active">
            <div id="postList" class="gridList"></div>
        </div>

        <div id="comments" class="tab-content comment-container">
            <div id="commentList"></div>
        </div>
    </div>

    

    <div class="upload-modal-overlay" id="uploadModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h1>게시물 삭제</h1>
      <div class="btn-group">
        <button class="btn-cancel" onclick="window.handleCancel()">취소</button>
        <button id="registerBtn" class="btn-register" style="background:#ef4444;" onclick="">삭제</button>
      </div>
    </div>
    <div class="modal-body">
      <div>
        <p class="section-label">등록된 사진</p>
        <div class="preview-list" id="previewList"></div>
        <div class="meta-box" id="metaBox" style="display:none;">
          <p class="meta-box-label">게시물 정보</p>
          <div class="meta-tags" id="metaTags"></div>
        </div>
      </div>
      <div class="divider"></div>
      <div>
        <p class="section-label">게시물 설명</p>
        <textarea id="descInput" readonly placeholder="내용이 없습니다."></textarea>
      </div>
      <div class="divider"></div>
      <div>
        <p class="section-label">쇼핑몰 링크</p>
        <div class="link-list" id="linkList"></div>
      </div>
      <div style="height:8px;"></div>
    </div>
  </div>
</div>

    <script src="/js/mypage.js?v=6"></script>
</body>
</html>
